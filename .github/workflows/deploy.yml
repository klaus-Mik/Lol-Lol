name: Build and Test Fullstack App

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify FastAPI routes
        run: |
          python -c "from fastapi.testclient import TestClient; from backend.main import app; client = TestClient(app); r = client.get('/api/health'); assert r.status_code == 200 and r.json()['status'] == 'ok'; n = client.get('/api/notes'); assert n.status_code == 200 and len(n.json()['notes']) >= 2; print('API checks passed')"

      - name: Build backend Docker image
        run: docker build -t gcp-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t gcp-frontend:ci ./frontend